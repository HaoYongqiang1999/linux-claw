server.port=8000

server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.servlet.encoding.charset=UTF-8

spring.application.name=Linux-Claw

# ====SpringAIAlibaba Config=============
spring.ai.dashscope.api-key=${aliQwen-api}
spring.ai.dashscope.base-url=https://dashscope.aliyuncs.com
spring.ai.dashscope.chat.options.model=qwen3-max-2026-01-23
#spring.ai.dashscope.chat.options.model=qwen-flash-character
#spring.ai.dashscope.chat.options.model=qwen-flash-character-2026-02-26

# MCP Client Config
spring.ai.mcp.client.request-timeout=60s
spring.ai.mcp.client.toolcallback.enabled=true
spring.ai.mcp.client.sse.connections.shell-exe-server.url=http://localhost:8001